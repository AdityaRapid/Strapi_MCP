runtime: "container"
build:
  dockerfile: "Dockerfile"
  dockerBuildPath: "."
startCommand:
  type: "http"
  configSchema:
    type: "object"
    properties:
      STRAPI_API_URL:
        type: "string"
        description: "URL of your Strapi instance"
      STRAPI_API_KEY:
        type: "string"
        description: "JWT token from Strapi Admin Panel"
      STRAPI_API_PREFIX:
        type: "string"
        description: "API prefix (e.g., /api/v1)"
        default: "/api"
      STRAPI_SERVER_NAME:
        type: "string"
        description: "Server instance name"
        default: "default"
    required: ["STRAPI_API_URL", "STRAPI_API_KEY"]
  exampleConfig:
    STRAPI_API_URL: "https://your-strapi-instance.com"
    STRAPI_API_KEY: "your-jwt-token-here"
    STRAPI_API_PREFIX: "/api/v1"
    STRAPI_SERVER_NAME: "production"
